name: CI - Tests et Validation Intégrale (DKG-CyberSec)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Installation des dépendances complètes
      #    (httpx ajouté : TestClient des tests routes Phase 8 P9)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl pytest faker anyio langsmith pydantic pydantic-settings sentence-transformers psutil fastapi uvicorn httpx

      # 4. Préparation de l'arborescence des dossiers de sortie
      - name: Ensure target directories exist
        run: |
          mkdir -p 02-Donnees/Master_Transversal/TLP_AMBER_Socle_TBox
          mkdir -p 02-Donnees/Master_Transversal/TLP_RED_Instances_ABox

      # 5. Exécution des générateurs amont
      #    TRACE P10 : vérifier les chemins après les renommages phases/
      #    (continue-on-error assumé : génération optionnelle si snapshots)
      - name: Run Phase 1 & 2 Generators (Optional if snapshots exist)
        continue-on-error: true
        run: |
          python3 03-Application/Phase1/generate_phase1_socle.py
          python3 03-Application/Phase2/generate_phase2_abox.py

      # 6. Suite de non-régression — DEPUIS LA RACINE (pytest.ini racine :
      #    marqueurs enregistrés (non_regression, domain), norecursedirs
      #    06-Archives, chemins Test/ rat attachés). Fini le cd 03-Application,
      #    qui ignorait le pytest.ini et déclenchait les UnknownMarkWarning.
      - name: Run Non-Regression Pytest Suite
        env:
          PYTHONPATH: "03-Application:03-Application/phases"
          HITM_AUTO_APPROVE: "1"
          REGISTRY_PATH: "../01_Principes_Specifications/registry_exigences.json"
        run: |
          pytest -m non_regression --junitxml=test-results.xml -q

      # 7. Publication des résultats de test dans l'interface GitHub
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results.xml"

      # 8. Archivage des rapports XML pour traçabilité
      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: test-results.xml
