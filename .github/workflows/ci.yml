name: CI - Tests et Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ⚠️ Étape 0 : Forcer Node.js 20 pour tout le workflow (solution temporaire)
      - name: Force Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Étape 1 : Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Configurer Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Si vous avez un requirements.txt :
          # pip install -r requirements.txt

      # Étape 4 : Exécuter les tests
      - name: Run tests
        run: |
          cd 00-Application/Tests
          pytest -v
