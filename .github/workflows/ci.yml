name: CI - Tests et Validation

# Déclenchement sur push/pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4  # ✅ Version stable et compatible

      # Étape 2 : Configurer Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5  # ✅ Version compatible Node.js 24
        with:
          python-version: '3.9'

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Si vous avez un requirements.txt, décommentez :
          # pip install -r requirements.txt

      # Étape 4 : Exécuter les tests
      - name: Run tests
        run: |
          cd 00-Application/Tests
          pytest -v

      # Étape 5 (Optionnel) : Sauvegarder les résultats des tests
      - name: Upload test results
        if: always()  # Même si les tests échouent
        uses: actions/upload-artifact@v4  # ✅ Version v4 (v3 est déprécié)
        with:
          name: pytest-results
          path: |
            00-Application/Tests/test-results.xml
          # Pour générer un rapport XML, utilisez :
          # pytest -v --junitxml=00-Application/Tests/test-results.xml
