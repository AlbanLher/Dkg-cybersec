name: CI - Tests et Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Si vous avez un requirements.txt :
          # pip install -r requirements.txt

      - name: Run tests
        run: |
          cd 00-Application/Tests
          pytest -v
