name: CI - Tests et Validation

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Installation des dépendances complètes
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl pytest faker anyio langsmith pydantic

      # 4. Exécution de la génération Phase 1 (Création du socle TBox)
      - name: Run Phase 1 Generator
        run: |
          python3 03-Application/Phase1/generate_phase1_socle.py

      # 5. Exécution de la génération Phase 2 (Création de l'ABox)
      - name: Run Phase 2 Generator
        run: |
          python3 03-Application/Phase2/generate_phase2_abox.py

      # 6. Exécution des tests Pytest Phase 1 et Phase 2
      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v 03-Application/Test/test_phase1_quality.py 03-Application/Test/test_phase2_abox.py --junitxml=test-results.xml

      # 7. Publication du rapport synthétique dans GitHub Actions
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results.xml"

      # 8. Archivage des rapports au format XML
      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: test-results.xml
