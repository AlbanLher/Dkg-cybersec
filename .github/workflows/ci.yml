name: CI - Tests et Validation Intégrale (DKG-CyberSec)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Set up environment and test
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Installation des dépendances complètes
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl pytest faker anyio langsmith pydantic pydantic-settings sentence-transformers

      # 4. Préparation de l'arborescence des dossiers de sortie
      - name: Ensure target directories exist
        run: |
          mkdir -p 02-Donnees/Snapshots_Phases/Phase1_Socle
          mkdir -p 02-Donnees/Snapshots_Phases/Phase2_ABox
          mkdir -p 02-Donnees/Snapshots_Phases/Phase5_Inference
          mkdir -p 02-Donnees/Snapshots_Phases/Phase8_Compliance
          mkdir -p 02-Donnees/Master_Transversal/TLP_AMBER_Socle_TBox
          mkdir -p 02-Donnees/Master_Transversal/TLP_RED_Instances_ABox

      # 5. Exécution des générateurs amont (si présents dans votre flux)
      - name: Run Phase 1 & 2 Generators (Optional if snapshots exist)
        continue-on-error: true
        run: |
          python3 03-Application/Phase1/generate_phase1_socle.py
          python3 03-Application/Phase2/generate_phase2_abox.py

      # 6. Exécution de la suite de tests globale (incluant le pipeline DKG/Phase 8)
      - name: Run Full Pytest Suite
        env:
          PYTHONPATH: .
          HITM_AUTO_APPROVE: "1"
        run: |
          pytest -v 03-Application/Test/ --junitxml=test-results.xml

      # 7. Publication des résultats de test dans l'interface GitHub
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results.xml"

      # 8. Archivage des rapports XML pour traçabilité
      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: test-results.xml
