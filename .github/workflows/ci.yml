name: CI - Tests et Validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.12 (aligné sur votre suite de tests)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Installation de l'ensemble des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl pytest faker anyio langsmith pytest-md

      # 4. Exécution des tests sous 03-Application/
      - name: Run tests
        run: |
          pytest -v 03-Application/ --junitxml=test-results.xml

      # 5. Publication du rapport
      - name: Publish Test Report
        if: always()
        uses: mikepennisi/build-junit-report@v5
        with:
          check_name: 'Rapport des Tests Pytest'
          report_paths: 'test-results.xml'
